id: no-new-date-edge
language: TypeScript
severity: hint
rule:
  pattern: new Date()
  not:
    inside:
      any:
        - pattern: new Date().toISOString()
        - pattern: new Date().getTime()
        - pattern: new Date(Date.now())
message: |
  Edge workers run in UTC only. Using new Date() without arguments
  can cause timezone-related bugs.

  Use Date.now() for timestamps or new Date(epochMs) for specific times.
note: |
  Bad:  new Date()                    → ambiguous timezone
  Good: Date.now()                    → milliseconds since epoch
  Good: new Date(timestamp)           → explicit UTC time
  Good: new Date().toISOString()      → UTC string (allowed)
  Good: new Date().getTime()          → epoch ms (allowed)

