id: console-log-in-source
message: Do not use `console.log` or `console.error` directly in source code. Use the StructuredLogger utility instead.
severity: error
language: TypeScript
rule:
  any:
    - pattern: console.log($$$)
    - pattern: console.error($$$)
    - pattern: console.warn($$$)
    - pattern: console.info($$$)
    - pattern: console.debug($$$)
