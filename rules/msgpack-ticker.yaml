id: msgpack-ticker
language: TypeScript
severity: hint
rule:
  pattern: JSON.stringify($TICKER_DATA)
message: |
  Ticker data should use MessagePack instead of JSON for efficiency.
  
  JSON: {"t":1712345678901,"odds":[1.95,3.40,3.80],"tv":2745632}  (~55B)
  MsgPack: Same data in ~38B (31% smaller)
  
  Use:
  import { encode } from '@msgpack/msgpack';
  const packed = encode(tickerData);
  socket.send(packed);
  
  Client decodes:
  import { decode } from '@msgpack/msgpack';
  const data = decode(new Uint8Array(event.data));
note: |
  MessagePack benefits for ticker:
  • 30% smaller payload (38B vs 55B)
  • Faster serialization (2× vs JSON)
  • 650k msg/s per core vs 450k with JSON
  
  Critical for sub-150ms propagation at scale.

