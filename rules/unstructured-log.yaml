id: unstructured-log
message: Unstructured log without requestId
severity: hint
language: TypeScript
rule:
  all:
    - pattern: console.log($MSG)
    - not:
        pattern: console.log(`[${requestId}]$$$`)
note: "All logs should include requestId prefix for traceability"
constraints:
  MSG:
    not:
      regex: '\[.*\]'  # Allow any bracketed prefix (requestId, batchId, etc.)
# Exclude files that don't have request context
ignore:
  - "src/queues/**"
  - "src/schedules/**"
  - "src/triggers/**"
  - "src/guards/costCap.ts"

