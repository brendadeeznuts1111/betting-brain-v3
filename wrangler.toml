name = "betting-brain-v3"
main = "src/index.ts"
compatibility_date = "2023-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "80693377f3abb78e00820aa69a415ce4"

[env.production]
name = "betting-brain-v3-prod"

[[d1_databases]]
binding = "ANALYTICS"
database_name = "betting-analytics"
database_id = "1fd6d6d3-7b0f-4488-a651-a234c61705b1"
migrations_dir = "migrations"

[[queues.producers]]
binding = "LINE_INGRESS"
queue = "line-ingress"

[[queues.consumers]]
queue = "line-ingress"
max_batch_size = 10
max_batch_timeout = 5

[[queues.producers]]
binding = "STEAM_WEBHOOK"
queue = "steam-webhook"

[[queues.consumers]]
queue = "steam-webhook"
max_batch_size = 5
max_batch_timeout = 10

# MCP Event-Driven Queues (from fantasy402-mcp)
[[queues.producers]]
binding = "STEAM_QUEUE"
queue = "steam-processor"

[[queues.consumers]]
queue = "steam-processor"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 2

[[queues.producers]]
binding = "EXPOSURE_QUEUE"
queue = "exposure-calculator"

[[queues.consumers]]
queue = "exposure-calculator"
max_batch_size = 50
max_batch_timeout = 10
max_retries = 3

# Fantasy402 Data Ingestion Queue (NEW!)
[[queues.producers]]
binding = "FANTASY402_QUEUE"
queue = "fantasy402-logs"

[[queues.consumers]]
queue = "fantasy402-logs"
max_batch_size = 100  # Process up to 100 logs at once
max_batch_timeout = 5  # Wait max 5 seconds before processing
max_retries = 5  # Retry up to 5 times if processing fails

[triggers]
crons = [
  "0 * * * *",  # hourly sharp calculation
  "* * * * *",  # every minute exposure calculation (closest to 30s possible)
  "*/1 * * * *",  # every minute - MCP cache warming
  "0 3 * * *"  # daily at 3 AM UTC - MCP cleanup old data
]

[[analytics_engine_datasets]]
binding = "ANALYTICS_ENGINE"
dataset = "betting-metrics"

# KV Namespace for BetTicker raw data storage
[[kv_namespaces]]
binding = "BET_TICKER_RAW"
id = "8b9618cb00c647f18ad83458e0061018"
preview_id = "0d4410da8b824c70834a0f105654029e"

# MCP Token Management KV Namespaces (from fantasy402-mcp)
[[kv_namespaces]]
binding = "TOKEN_STORE"
id = "47da877d6aab4edc91ee6f052a056769"

[[kv_namespaces]]
binding = "USER_STORE"
id = "74003502667e42ae9271ec9a1591a2b0"

[[kv_namespaces]]
binding = "SESSION_STORE"
id = "c00d737fbf124185868c638af8ff3507"

[[kv_namespaces]]
binding = "REFRESH_STORE"
id = "0e4571a38a9d4c4781a982d05fd1291b"

[[kv_namespaces]]
binding = "LIVEBETS_STORE"
id = "321ecd09a5764e1cb04a3e87c37d590c"

# Fantasy402 Data Cache (for intercepted API data)
[[kv_namespaces]]
binding = "FANTASY_CACHE"
id = "e8ea80789b5246e58ea95798f04d0047"

# MCP Raw Feed Database (from fantasy402-mcp)
[[d1_databases]]
binding = "RAW_FEED_DB"
database_name = "fantasy42-raw-feed"
database_id = "1b2e8ea8-a702-4cc7-9665-a8bea78b5dea"

[limits]
cpu_ms = 50
