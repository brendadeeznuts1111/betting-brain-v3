<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
    }
    
    h1 {
      margin: 0 0 12px 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status {
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      margin: 12px 0;
    }
    
    .status-item {
      display: flex;
      justify-between;
      margin: 6px 0;
      font-size: 13px;
    }
    
    .status-label {
      opacity: 0.8;
    }
    
    .status-value {
      font-weight: bold;
    }
    
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin: 6px 0;
    }
    
    .btn-primary {
      background: #10b981;
      color: white;
    }
    
    .btn-primary:hover {
      background: #059669;
    }
    
    .btn-primary.disabled {
      background: #ef4444;
    }
    
    .btn-primary.disabled:hover {
      background: #dc2626;
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .link {
      display: block;
      color: white;
      text-decoration: none;
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      opacity: 0.8;
    }
    
    .link:hover {
      opacity: 1;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.2);
    }
    
    .badge.success {
      background: #10b981;
    }
    
    .badge.error {
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      🎯 BetTicker Interceptor
    </h1>
    
    <div class="status">
      <div class="status-item">
        <span class="status-label">Status:</span>
        <span class="badge" id="statusBadge">Loading...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Intercepts:</span>
        <span class="status-value" id="interceptCount">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">Last Activity:</span>
        <span class="status-value" id="lastIntercept">Never</span>
      </div>
    </div>
    
    <button id="toggleBtn" class="btn-primary">
      Loading...
    </button>
    
    <button id="resetBtn" class="btn-secondary">
      🔄 Reset Counter
    </button>
    
    <button id="dashboardBtn" class="btn-secondary">
      📊 Open Dashboard
    </button>
    
    <a href="https://betting-brain-v3.nolarose1968-806.workers.dev/interceptor/history" target="_blank" class="link">
      View Intercepted Data →
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
