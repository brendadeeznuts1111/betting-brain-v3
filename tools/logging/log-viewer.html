<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Extension Log Viewer</title>
    <style>
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .header {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #007acc;
        }
        
        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-online { background: #4caf50; }
        .status-offline { background: #f44336; }
        .status-unknown { background: #ff9800; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        
        button:hover {
            background: #005a9e;
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .log-container {
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            height: 600px;
            overflow-y: auto;
            padding: 15px;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 4px 0;
            border-bottom: 1px solid #222;
        }
        
        .log-timestamp {
            color: #666;
            margin-right: 10px;
        }
        
        .log-level {
            font-weight: bold;
            margin-right: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        
        .log-level-error { background: #d32f2f; color: white; }
        .log-level-warn { background: #f57c00; color: white; }
        .log-level-info { background: #1976d2; color: white; }
        .log-level-debug { background: #388e3c; color: white; }
        .log-level-log { background: #666; color: white; }
        
        .log-message {
            color: #e0e0e0;
        }
        
        .log-meta {
            color: #888;
            font-size: 11px;
            margin-top: 2px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
        
        .auto-scroll {
            position: sticky;
            top: 0;
            background: #2d2d2d;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .auto-scroll label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        input[type="checkbox"] {
            accent-color: #007acc;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="status">
            <div>
                <span class="status-indicator status-unknown" id="statusIndicator"></span>
                <span id="statusText">Connecting...</span>
            </div>
            <div id="sessionInfo">Session: <span id="sessionId">-</span></div>
        </div>
        <div>🔍 Extension Log Viewer - Real-time monitoring</div>
    </div>
    
    <div class="controls">
        <button onclick="startMonitoring()" id="startBtn">Start Monitoring</button>
        <button onclick="stopMonitoring()" id="stopBtn" disabled>Stop Monitoring</button>
        <button onclick="clearLogs()">Clear Logs</button>
        <button onclick="testWorker()">Test Worker</button>
        <button onclick="exportLogs()">Export Logs</button>
    </div>
    
    <div class="auto-scroll">
        <label>
            <input type="checkbox" id="autoScroll" checked>
            Auto-scroll to bottom
        </label>
    </div>
    
    <div class="log-container" id="logContainer">
        <div class="log-entry">
            <span class="log-timestamp">[Ready]</span>
            <span class="log-level log-level-info">INFO</span>
            <span class="log-message">Extension Log Viewer ready. Click "Start Monitoring" to begin.</span>
        </div>
    </div>
    
    <div class="stats">
        <div>Total Logs: <span id="logCount">0</span></div>
        <div>Errors: <span id="errorCount">0</span></div>
        <div>Warnings: <span id="warnCount">0</span></div>
        <div>Last Update: <span id="lastUpdate">Never</span></div>
    </div>

    <script>
        class LogViewer {
            constructor() {
                this.workerUrl = 'https://betting-brain-v3.nolarose1968-806.workers.dev';
                this.sessionId = `viewer-${Date.now()}`;
                this.isMonitoring = false;
                this.logs = [];
                this.stats = {
                    total: 0,
                    errors: 0,
                    warnings: 0
                };
                
                this.initializeElements();
                this.startWorkerHealthCheck();
            }
            
            initializeElements() {
                this.logContainer = document.getElementById('logContainer');
                this.statusIndicator = document.getElementById('statusIndicator');
                this.statusText = document.getElementById('statusText');
                this.sessionIdElement = document.getElementById('sessionId');
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.autoScrollCheckbox = document.getElementById('autoScroll');
                
                // Stats elements
                this.logCountElement = document.getElementById('logCount');
                this.errorCountElement = document.getElementById('errorCount');
                this.warnCountElement = document.getElementById('warnCount');
                this.lastUpdateElement = document.getElementById('lastUpdate');
                
                this.sessionIdElement.textContent = this.sessionId;
            }
            
            async startMonitoring() {
                if (this.isMonitoring) return;
                
                this.isMonitoring = true;
                this.startBtn.disabled = true;
                this.stopBtn.disabled = false;
                this.statusText.textContent = 'Monitoring...';
                this.statusIndicator.className = 'status-indicator status-online';
                
                this.addLog('info', 'Started monitoring extension logs');
                
                // Start polling for logs
                this.pollLogs();
            }
            
            stopMonitoring() {
                this.isMonitoring = false;
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.statusText.textContent = 'Stopped';
                this.statusIndicator.className = 'status-indicator status-offline';
                
                this.addLog('info', 'Stopped monitoring extension logs');
            }
            
            async pollLogs() {
                while (this.isMonitoring) {
                    try {
                        await this.checkForNewLogs();
                        await this.sleep(3000); // Check every 3 seconds
                    } catch (error) {
                        console.error('Polling error:', error);
                        await this.sleep(5000);
                    }
                }
            }
            
            async checkForNewLogs() {
                // This would normally check for new logs from the worker
                // For now, we'll simulate log entries
                if (Math.random() < 0.1) { // 10% chance of new log
                    this.simulateLogEntry();
                }
            }
            
            simulateLogEntry() {
                const levels = ['info', 'debug', 'warn', 'error'];
                const messages = [
                    '🎯 BetTicker content script loaded',
                    '🌐 Current domain: fantasy402.com',
                    '🍪 Available cookies: 245 chars',
                    '🔍 DEBUG: Testing fetch interception',
                    '❌ Error: Cannot read properties of undefined',
                    '⚠️ Circuit breaker OPEN, falling back to origin'
                ];
                
                const level = levels[Math.floor(Math.random() * levels.length)];
                const message = messages[Math.floor(Math.random() * messages.length)];
                
                this.addLog(level, message);
            }
            
            addLog(level, message, meta = {}) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = {
                    timestamp,
                    level,
                    message,
                    meta,
                    id: Date.now()
                };
                
                this.logs.push(logEntry);
                this.updateStats(level);
                
                // Create log element
                const logElement = document.createElement('div');
                logElement.className = 'log-entry';
                logElement.innerHTML = `
                    <span class="log-timestamp">[${timestamp}]</span>
                    <span class="log-level log-level-${level}">${level.toUpperCase()}</span>
                    <span class="log-message">${message}</span>
                    ${Object.keys(meta).length ? `<div class="log-meta">${JSON.stringify(meta)}</div>` : ''}
                `;
                
                this.logContainer.appendChild(logElement);
                
                // Auto-scroll if enabled
                if (this.autoScrollCheckbox.checked) {
                    this.logContainer.scrollTop = this.logContainer.scrollHeight;
                }
                
                // Keep only last 1000 logs
                if (this.logs.length > 1000) {
                    this.logs.shift();
                    const firstLog = this.logContainer.firstChild;
                    if (firstLog) {
                        this.logContainer.removeChild(firstLog);
                    }
                }
                
                this.updateStatsDisplay();
            }
            
            updateStats(level) {
                this.stats.total++;
                if (level === 'error') this.stats.errors++;
                if (level === 'warn') this.stats.warnings++;
            }
            
            updateStatsDisplay() {
                this.logCountElement.textContent = this.stats.total;
                this.errorCountElement.textContent = this.stats.errors;
                this.warnCountElement.textContent = this.stats.warnings;
                this.lastUpdateElement.textContent = new Date().toLocaleTimeString();
            }
            
            async startWorkerHealthCheck() {
                try {
                    const response = await fetch(`${this.workerUrl}/health`);
                    const health = await response.json();
                    
                    if (health.status === 'healthy') {
                        this.statusText.textContent = 'Worker Online';
                        this.statusIndicator.className = 'status-indicator status-online';
                    } else {
                        this.statusText.textContent = 'Worker Unknown';
                        this.statusIndicator.className = 'status-indicator status-unknown';
                    }
                } catch (error) {
                    this.statusText.textContent = 'Worker Offline';
                    this.statusIndicator.className = 'status-indicator status-offline';
                }
                
                // Check every 30 seconds
                setTimeout(() => this.startWorkerHealthCheck(), 30000);
            }
            
            async testWorker() {
                try {
                    this.addLog('info', 'Testing worker connection...');
                    const response = await fetch(`${this.workerUrl}/health`);
                    const health = await response.json();
                    
                    this.addLog('success', `Worker test successful: ${health.status}`, health);
                } catch (error) {
                    this.addLog('error', `Worker test failed: ${error.message}`);
                }
            }
            
            clearLogs() {
                this.logs = [];
                this.stats = { total: 0, errors: 0, warnings: 0 };
                this.logContainer.innerHTML = '';
                this.updateStatsDisplay();
                this.addLog('info', 'Logs cleared');
            }
            
            exportLogs() {
                const logData = {
                    sessionId: this.sessionId,
                    timestamp: new Date().toISOString(),
                    logs: this.logs,
                    stats: this.stats
                };
                
                const blob = new Blob([JSON.stringify(logData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `extension-logs-${this.sessionId}.json`;
                a.click();
                URL.revokeObjectURL(url);
                
                this.addLog('info', 'Logs exported successfully');
            }
            
            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }
        
        // Initialize the log viewer
        const logViewer = new LogViewer();
        
        // Global functions for buttons
        function startMonitoring() {
            logViewer.startMonitoring();
        }
        
        function stopMonitoring() {
            logViewer.stopMonitoring();
        }
        
        function clearLogs() {
            logViewer.clearLogs();
        }
        
        function testWorker() {
            logViewer.testWorker();
        }
        
        function exportLogs() {
            logViewer.exportLogs();
        }
        
        // Add some initial logs for demonstration
        setTimeout(() => {
            logViewer.addLog('info', '🔍 Log Viewer initialized');
            logViewer.addLog('debug', 'Worker URL: https://betting-brain-v3.nolarose1968-806.workers.dev');
            logViewer.addLog('info', 'Ready to monitor extension logs');
        }, 1000);
    </script>
</body>
</html>
