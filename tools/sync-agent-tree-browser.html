<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy402 Agent Tree Sync</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #333; margin-top: 0; }
    .status { padding: 15px; border-radius: 4px; margin: 15px 0; }
    .status.info { background: #e3f2fd; color: #1976d2; }
    .status.success { background: #e8f5e9; color: #388e3c; }
    .status.error { background: #ffebee; color: #d32f2f; }
    .status.warning { background: #fff3e0; color: #f57c00; }
    input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #1976d2; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1565c0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    .progress { margin: 15px 0; }
    .progress-bar { width: 100%; height: 30px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #1976d2; transition: width 0.3s; display: flex; align-items: center; padding-left: 10px; color: white; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌳 Fantasy402 Agent Tree Sync</h1>
    <p>Sync all agents from Fantasy402 to your Worker database for the enhanced hierarchy dashboard.</p>

    <div id="config">
      <label>
        <strong>Worker URL:</strong>
        <input type="text" id="workerUrl" value="http://localhost:8787" placeholder="https://your-worker.workers.dev">
      </label>

      <label>
        <strong>Bearer Token:</strong>
        <input type="text" id="bearerToken" placeholder="Paste your Fantasy402 bearer token">
      </label>

      <label>
        <strong>Agent ID:</strong>
        <input type="text" id="agentId" value="BILLY666" placeholder="BILLY666">
      </label>

      <button id="syncBtn" onclick="syncAgents()">🚀 Start Sync</button>
    </div>

    <div id="status"></div>

    <div id="progress" class="progress" style="display: none;">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width: 0%">0%</div>
      </div>
    </div>

    <div id="results"></div>
  </div>

  <script>
    const FANTASY402_API = 'https://fantasy402.com/cloud/api/Manager/getListAgenstByAgent';

    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
    }

    function showProgress(percent, text) {
      const progressDiv = document.getElementById('progress');
      const progressFill = document.getElementById('progressFill');
      progressDiv.style.display = 'block';
      progressFill.style.width = percent + '%';
      progressFill.textContent = text || `${percent}%`;
    }

    function hideProgress() {
      document.getElementById('progress').style.display = 'none';
    }

    async function syncAgents() {
      const workerUrl = document.getElementById('workerUrl').value;
      const bearerToken = document.getElementById('bearerToken').value;
      const agentId = document.getElementById('agentId').value;
      const syncBtn = document.getElementById('syncBtn');

      if (!workerUrl || !bearerToken || !agentId) {
        showStatus('❌ Please fill in all fields', 'error');
        return;
      }

      try {
        syncBtn.disabled = true;
        showStatus('📡 Fetching agents from Fantasy402...', 'info');
        showProgress(10, 'Fetching...');

        // Step 1: Fetch agents
        const response = await fetch(FANTASY402_API, {
          method: 'POST',
          headers: {
            'authorization': `Bearer ${bearerToken}`,
            'content-type': 'application/x-www-form-urlencoded; charset=UTF-8'
          },
          body: `agentID=${agentId}&agentType=M&token=${bearerToken}&operation=getListAgenstByAgent&RRO=1&agentOwner=${agentId}&agentSite=1`
        });

        if (!response.ok) {
          throw new Error(`Fantasy402 API error: ${response.status}`);
        }

        const agents = await response.json();
        showStatus(`✅ Fetched ${agents.length} agents from Fantasy402`, 'success');
        showProgress(30, `Processing ${agents.length} agents...`);

        // Step 2: Build tree
        const agentMap = {};
        const rootAgents = [];

        agents.forEach(agent => {
          agentMap[agent.agentID] = {
            agent_id: agent.agentID,
            parent_id: agent.parentID || null,
            agent_type: agent.agentType || 'A',
            agent_owner: agent.agentOwner || agentId,
            agent_name: agent.agentName || agent.agentID,
            credit_limit: parseFloat(agent.creditLimit) || 0,
            outstanding_balance: parseFloat(agent.outstandingBalance) || 0,
            hold_percentage: parseFloat(agent.holdPercentage) || 0,
            active: agent.active !== false ? 1 : 0,
            site_id: agent.siteID || 1,
            children: []
          };
        });

        agents.forEach(agent => {
          const node = agentMap[agent.agentID];
          const parentId = agent.parentID;

          if (!parentId || parentId === agent.agentID) {
            rootAgents.push(node);
          } else if (agentMap[parentId]) {
            agentMap[parentId].children.push(node);
          } else {
            rootAgents.push(node);
          }
        });

        showProgress(50, 'Building tree...');

        // Step 3: Flatten for database
        const flatAgents = [];
        function flatten(node, level = 0, path = '') {
          const agentPath = path ? `${path}/${node.agent_id}` : `/${node.agent_id}`;
          flatAgents.push({
            agent_id: node.agent_id,
            parent_id: node.parent_id,
            agent_type: node.agent_type,
            agent_owner: node.agent_owner,
            agent_name: node.agent_name,
            credit_limit: node.credit_limit,
            outstanding_balance: node.outstanding_balance,
            hold_percentage: node.hold_percentage,
            level: level,
            path: agentPath,
            active: node.active,
            site_id: node.site_id,
            synced_at: Date.now()
          });

          if (node.children && node.children.length > 0) {
            node.children.forEach(child => flatten(child, level + 1, agentPath));
          }
        }

        rootAgents.forEach(root => flatten(root));
        showProgress(70, `Syncing ${flatAgents.length} agents to database...`);

        // Step 4: Send to Worker
        const syncResponse = await fetch(`${workerUrl}/api/f402/agents/sync`, {
          method: 'POST',
          headers: {
            'content-type': 'application/json'
          },
          body: JSON.stringify({
            agents: flatAgents,
            source: 'fantasy402-browser-sync',
            timestamp: new Date().toISOString()
          })
        });

        if (!syncResponse.ok) {
          const error = await syncResponse.text();
          throw new Error(`Worker sync error: ${syncResponse.status} - ${error}`);
        }

        const result = await syncResponse.json();
        showProgress(100, 'Complete!');

        setTimeout(() => hideProgress(), 2000);

        showStatus(`🎉 Sync complete! ${result.upserted} agents synced.`, 'success');

        document.getElementById('results').innerHTML = `
          <h3>Results</h3>
          <pre>${JSON.stringify(result, null, 2)}</pre>
          <div class="status success">
            ✅ All agents synced successfully!<br>
            Refresh the <a href="${workerUrl.replace('8787', '8080')}/hierarchy-enhanced.html" target="_blank">hierarchy dashboard</a> to see all agents.
          </div>
        `;

      } catch (error) {
        hideProgress();
        showStatus(`❌ Sync failed: ${error.message}`, 'error');
        document.getElementById('results').innerHTML = `
          <div class="status error">
            <strong>Error Details:</strong><br>
            ${error.message}<br><br>
            <strong>Troubleshooting:</strong><br>
            • Check that your bearer token is valid (not expired)<br>
            • Verify the Worker URL is correct and accessible<br>
            • Make sure the Worker is running (wrangler dev --local)<br>
            • Check browser console for more details
          </div>
        `;
        console.error('Sync error:', error);
      } finally {
        syncBtn.disabled = false;
      }
    }

    // Auto-detect Worker URL if on localhost
    if (window.location.hostname === 'localhost') {
      document.getElementById('workerUrl').value = 'http://localhost:8787';
    }
  </script>
</body>
</html>
