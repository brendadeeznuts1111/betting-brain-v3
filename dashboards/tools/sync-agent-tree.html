<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy402 Agent Tree Sync</title>
  <script type="module" src="shared/config.js"></script>
  <script type="module" src="shared/utils.js"></script>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    /* Sync Agent Tree specific styles */
    .sync-container {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .sync-card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .sync-title {
      color: #333;
      margin-top: 0;
    }

    .sync-status {
      padding: 15px;
      border-radius: 4px;
      margin: 15px 0;
    }

    .sync-status.info {
      background: #e3f2fd;
      color: #1976d2;
    }

    .sync-status.success {
      background: #e8f5e9;
      color: #388e3c;
    }

    .sync-status.error {
      background: #ffebee;
      color: #d32f2f;
    }

    .sync-status.warning {
      background: #fff3e0;
      color: #f57c00;
    }

    .sync-input {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .sync-button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    .sync-button:hover {
      background: #1565c0;
    }

    .sync-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .sync-pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }

    .sync-progress {
      margin: 15px 0;
    }

    .sync-progress-bar {
      width: 100%;
      height: 30px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }

    .sync-progress-fill {
      height: 100%;
      background: #1976d2;
      transition: width 0.3s;
      display: flex;
      align-items: center;
      padding-left: 10px;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body class="sync-container">
  <div class="sync-card">
    <h1 class="sync-title">🌳 Fantasy402 Agent Tree Sync</h1>
    <p>Sync all agents from Fantasy402 to your Worker database for the enhanced hierarchy dashboard.</p>

    <div id="config">
      <label>
        <strong>Worker URL:</strong>
        <input type="text" id="workerUrl" class="sync-input" value="http://localhost:8787"
          placeholder="https://your-worker.workers.dev">
      </label>

      <label>
        <strong>Bearer Token:</strong>
        <input type="text" id="bearerToken" class="sync-input" placeholder="Paste your Fantasy402 bearer token">
      </label>

      <label>
        <strong>Agent ID:</strong>
        <input type="text" id="agentId" class="sync-input" value="BILLY666" placeholder="BILLY666">
      </label>

      <button id="syncBtn" class="sync-button" onclick="syncAgents()">🚀 Start Sync</button>
    </div>

    <div id="status"></div>

    <div id="progress" class="sync-progress" style="display: none;">
      <div class="sync-progress-bar">
        <div id="progressFill" class="sync-progress-fill" style="width: 0%">0%</div>
      </div>
    </div>

    <div id="results"></div>
  </div>

  <script type="module">
    import { WORKER_URL, API_ENDPOINTS, ERROR_MESSAGES } from './shared/config.js';
    import { fetchAPI, updateElementText, showToast } from './shared/utils.js';

    const FANTASY402_API = 'https://fantasy402.com/cloud/api/Manager/getListAgenstByAgent';

    function showStatus(message, type = 'info') {
      const statusDiv = $('status');
      if (statusDiv) statusDiv.innerHTML = `<div class="sync-status ${type}">${message}</div>`;
    }

    function showProgress(percent, text) {
      const progressDiv = $('progress');
      const progressFill = $('progressFill');
      if (progressDiv) progressDiv.style.display = 'block';
      if (progressFill) {
        progressFill.style.width = percent + '%';
        progressFill.textContent = text || `${percent}%`;
      }
    }

    function hideProgress() {
      const progressDiv = $('progress');
      if (progressDiv) progressDiv.style.display = 'none';
    }

    async function syncAgents() {
      const workerUrlEl = $('workerUrl');
      const bearerTokenEl = $('bearerToken');
      const agentIdEl = $('agentId');
      const syncBtnEl = $('syncBtn');

      if (!workerUrlEl || !bearerTokenEl || !agentIdEl || !syncBtnEl) return;

      const workerUrl = workerUrlEl.value;
      let bearerToken = bearerTokenEl.value.trim();
      const agentId = agentIdEl.value;
      const syncBtn = syncBtnEl;

      // Auto-extract token if wrapped in JSON
      if (bearerToken.startsWith('{') || bearerToken.startsWith('"')) {
        try {
          const parsed = JSON.parse(bearerToken);
          bearerToken = parsed.code || parsed.token || parsed;
          console.log('Extracted token from JSON wrapper');
        } catch (e) {
          // Not valid JSON, use as-is
        }
      }

      if (!workerUrl || !bearerToken || !agentId) {
        showStatus('❌ Please fill in all fields', 'error');
        return;
      }

      try {
        syncBtn.disabled = true;
        showStatus('📡 Fetching agents from Fantasy402...', 'info');
        showProgress(10, 'Fetching...');

        // Step 1: Fetch agents
        const response = await fetch(FANTASY402_API, {
          method: 'POST',
          headers: {
            'authorization': `Bearer ${bearerToken}`,
            'content-type': 'application/x-www-form-urlencoded; charset=UTF-8'
          },
          body: `agentID=${agentId}&agentType=M&token=${bearerToken}&operation=getListAgenstByAgent&RRO=1&agentOwner=${agentId}&agentSite=1`
        });

        if (!response.ok) {
          throw new Error(`Fantasy402 API error: ${response.status}`);
        }

        const agents = await response.json();
        showStatus(`✅ Fetched ${agents.length} agents from Fantasy402`, 'success');
        showProgress(30, `Processing ${agents.length} agents...`);

        // Step 2: Build tree
        const agentMap = {};
        const rootAgents = [];

        agents.forEach(agent => {
          agentMap[agent.agentID] = {
            agent_id: agent.agentID,
            parent_id: agent.parentID || null,
            agent_type: agent.agentType || 'A',
            agent_owner: agent.agentOwner || agentId,
            agent_name: agent.agentName || agent.agentID,
            credit_limit: Number(agent.creditLimit) || 0,
            outstanding_balance: Number(agent.outstandingBalance) || 0,
            hold_percentage: Number(agent.holdPercentage) || 0,
            active: agent.active !== false ? 1 : 0,
            site_id: agent.siteID || 1,
            children: []
          };
        });

        agents.forEach(agent => {
          const node = agentMap[agent.agentID];
          const parentId = agent.parentID;

          if (!parentId || parentId === agent.agentID) {
            rootAgents.push(node);
          } else if (agentMap[parentId]) {
            agentMap[parentId].children.push(node);
          } else {
            rootAgents.push(node);
          }
        });

        showProgress(50, 'Building tree...');

        // Step 3: Flatten for database
        const flatAgents = [];
        function flatten(node, level = 0, path = '') {
          const agentPath = path ? `${path}/${node.agent_id}` : `/${node.agent_id}`;
          flatAgents.push({
            agent_id: node.agent_id,
            parent_id: node.parent_id,
            agent_type: node.agent_type,
            agent_owner: node.agent_owner,
            agent_name: node.agent_name,
            credit_limit: node.credit_limit,
            outstanding_balance: node.outstanding_balance,
            hold_percentage: node.hold_percentage,
            level: level,
            path: agentPath,
            active: node.active,
            site_id: node.site_id,
            synced_at: Date.now()
          });

          if (node.children && node.children.length > 0) {
            node.children.forEach(child => flatten(child, level + 1, agentPath));
          }
        }

        rootAgents.forEach(root => flatten(root));
        showProgress(70, `Syncing ${flatAgents.length} agents to database...`);

        // Step 4: Send to Worker
        const syncResponse = await fetch(`${workerUrl}/api/f402/agents/sync`, {
          method: 'POST',
          headers: {
            'content-type': 'application/json'
          },
          body: JSON.stringify({
            agents: flatAgents,
            source: 'fantasy402-browser-sync',
            timestamp: new Date().toISOString()
          })
        });

        if (!syncResponse.ok) {
          const error = await syncResponse.text();
          throw new Error(`Worker sync error: ${syncResponse.status} - ${error}`);
        }

        const result = await syncResponse.json();
        showProgress(100, 'Complete!');

        setTimeout(() => hideProgress(), 2000);

        showStatus(`🎉 Sync complete! ${result.upserted} agents synced.`, 'success');

        const resultsEl = $('results');
        if (resultsEl) {
          resultsEl.innerHTML = `
            <h3>Results</h3>
            <pre class="sync-pre">${JSON.stringify(result, null, 2)}</pre>
            <div class="sync-status success">
              ✅ All agents synced successfully!<br>
              Refresh the <a href="${workerUrl.replace('8787', '8080')}/hierarchy-enhanced.html" target="_blank">hierarchy dashboard</a> to see all agents.
            </div>
          `;
        }

      } catch (error) {
        hideProgress();
        const isCORS = error.message === 'Failed to fetch' || error.message.includes('CORS');

        showStatus(`❌ Sync failed: ${error.message}`, 'error');

        const resultsEl = $('results');
        if (resultsEl) {
          if (isCORS) {
            resultsEl.innerHTML = `
              <div class="sync-status warning">
                <strong>⚠️ CORS Error - Use Alternate Method</strong><br><br>
                The browser is blocking direct access to Fantasy402 API due to CORS policy.<br><br>

                <strong>Solution: Use the Node.js sync script instead:</strong><br>
                1. Open terminal<br>
                2. Run: <code>FANTASY402_BEARER="${bearerToken}" bun scripts/sync-agent-tree.js</code><br>
                3. Or set the token in the script and run: <code>bun scripts/sync-agent-tree.js</code><br><br>

                The script bypasses CORS and syncs all agents directly.
              </div>
            `;
          } else {
            resultsEl.innerHTML = `
              <div class="sync-status error">
                <strong>Error Details:</strong><br>
                ${error.message}<br><br>
                <strong>Troubleshooting:</strong><br>
                • Check that your bearer token is valid (not expired)<br>
                • Verify the Worker URL is correct and accessible<br>
                • Make sure the Worker is running (wrangler dev --local)<br>
                • Check browser console for more details
              </div>
            `;
          }
        }
        console.error('Sync error:', error);
      } finally {
        syncBtn.disabled = false;
      }
    }

    // Auto-detect Worker URL if on localhost
    if (window.location.hostname === 'localhost') {
      const workerUrlEl = $('workerUrl');
      if (workerUrlEl) workerUrlEl.value = 'http://localhost:8787';
    }
  </script>
</body>

</html>
