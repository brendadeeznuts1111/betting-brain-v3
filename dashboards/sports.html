<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Sports Odds - Betting Brain</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="./shared/styles.css">
</head>

<body class="sports-container">
  <h1 class="sports-title">🎲 Live Sports Odds</h1>
  <p class="sports-subtitle">Real-time odds aggregation from multiple bookmakers</p>

  <div class="sports-controls">
    <div class="sports-control-group">
      <label for="sport">Sport</label>
      <select id="sport">
        <option value="nba">NBA</option>
        <option value="nfl">NFL</option>
        <option value="mlb">MLB</option>
        <option value="nhl">NHL</option>
      </select>
    </div>

    <div class="sports-control-group">
      <label for="market">Market</label>
      <select id="market">
        <option value="moneyline">Moneyline</option>
        <option value="spread">Spread</option>
        <option value="total">Total</option>
      </select>
    </div>

    <button onclick="refresh()" style="margin-top: auto;">🔄 Refresh Now</button>
  </div>

  <div id="error" class="sports-error" style="display: none;"></div>
  <div id="loading" class="sports-loading" style="display: none;">Loading odds data...</div>

  <div class="sports-stats" id="stats"></div>

  <div class="sports-chart-container">
    <canvas id="oddsChart"></canvas>
  </div>

  <div class="sports-footer">
    Auto-refreshes every 30 seconds • Data cached for 30s • Powered by Betting Brain v3
  </div>

  <script type="module">
    import { WORKER_URL, API_ENDPOINTS, REFRESH_INTERVALS, ERROR_MESSAGES, CHART_COLORS } from './shared/config.js';
    import { fetchWidgetData, updateElementText, formatLargeNumber, formatCurrency, showToast } from './shared/utils.js';

    const ctx = document.getElementById('oddsChart');
    let chart;

    function initChart() {
      chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: 'Live Odds Comparison',
              font: { size: 18, weight: 'bold' }
            },
            legend: {
              position: 'top',
              labels: { font: { size: 14 } }
            },
            tooltip: {
              mode: 'index',
              intersect: false,
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              title: {
                display: true,
                text: 'Odds',
                font: { size: 14, weight: 'bold' }
              }
            },
            x: {
              title: {
                display: true,
                text: 'Bookmaker',
                font: { size: 14, weight: 'bold' }
              }
            }
          }
        }
      });
    }

    async function refresh() {
      const sport = document.getElementById('sport').value;
      const market = document.getElementById('market').value;
      const errorDiv = document.getElementById('error');
      const loadingDiv = document.getElementById('loading');
      const statsDiv = document.getElementById('stats');

      errorDiv.style.display = 'none';
      loadingDiv.style.display = 'block';
      statsDiv.innerHTML = '';

      try {
        const data = await fetchWidgetData('liveOdds', { sport, market });

        if (!data || !data.sources) {
          throw new Error(ERROR_MESSAGES.fetchError);
        }

        // Update stats
        const successfulSources = data.sources.filter(s => s.data !== null).length;
        const failedSources = data.sources.filter(s => s.data === null).length;

        statsDiv.innerHTML = `
          <div class="sports-stat-card">
            <div class="sports-stat-label">📊 Total Sources</div>
            <div class="sports-stat-value">${data.sources.length}</div>
          </div>
          <div class="sports-stat-card">
            <div class="sports-stat-label">✅ Successful</div>
            <div class="sports-stat-value" style="color: ${CHART_COLORS.success};">${successfulSources}</div>
          </div>
          <div class="sports-stat-card">
            <div class="sports-stat-label">❌ Failed</div>
            <div class="sports-stat-value" style="color: ${CHART_COLORS.danger};">${failedSources}</div>
          </div>
          <div class="sports-stat-card">
            <div class="sports-stat-label">⏱️ Last Update</div>
            <div class="sports-stat-value" style="font-size: 1.25rem;">${new Date(data.aggregatedAt).toLocaleTimeString()}</div>
          </div>
          <div class="sports-stat-card">
            <div class="sports-stat-label">💾 Cache Status</div>
            <div class="sports-stat-value" style="font-size: 1.5rem; color: ${data.cacheHit ? CHART_COLORS.success : CHART_COLORS.warning};">
              ${data.cacheHit ? 'HIT' : 'MISS'}
            </div>
          </div>
        `;

        // Update chart with only successful sources
        const successful = data.sources.filter(s => s.data !== null);
        const labels = successful.map(s => s.source.toUpperCase());

        const datasets = [
          {
            label: 'Home Odds',
            data: successful.map(s => s.data.home),
            borderColor: CHART_COLORS.primary,
            backgroundColor: `${CHART_COLORS.primary}1A`, // 1A for 10% opacity
            borderWidth: 3,
            pointRadius: 6,
            pointHoverRadius: 8,
            tension: 0.3
          },
          {
            label: 'Away Odds',
            data: successful.map(s => s.data.away),
            borderColor: CHART_COLORS.danger,
            backgroundColor: `${CHART_COLORS.danger}1A`, // 1A for 10% opacity
            borderWidth: 3,
            pointRadius: 6,
            pointHoverRadius: 8,
            tension: 0.3
          }
        ];

        chart.data = { labels, datasets };
        chart.update();

        loadingDiv.style.display = 'none';
      } catch (error) {
        updateElementText('error', `❌ ${error.message}`);
        errorDiv.style.display = 'block';
        loadingDiv.style.display = 'none';
        console.error('Fetch error:', error);
        showToast(ERROR_MESSAGES.serverError, 'error');
      }
    }

    // Initial chart setup
    initChart();

    // Auto-refresh
    setInterval(refresh, REFRESH_INTERVALS.sports);

    // Initial load
    refresh();
  </script>
</body>

</html>
