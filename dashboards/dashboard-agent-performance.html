<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Performance Dashboard - Betting Brain v3</title>
    <link rel="stylesheet" href="shared/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --light: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            margin: 0;
            color: var(--dark);
            font-size: 28px;
        }

        .header .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-top: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card .label {
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-card .change {
            font-size: 14px;
            font-weight: 600;
        }

        .stat-card.positive .value {
            color: var(--success);
        }

        .stat-card.negative .value {
            color: var(--danger);
        }

        .stat-card.neutral .value {
            color: var(--primary);
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chart-container h2 {
            margin: 0 0 20px 0;
            color: var(--dark);
            font-size: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .filters h3 {
            margin: 0 0 15px 0;
            color: var(--dark);
            font-size: 18px;
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--dark);
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
        }

        .filter-group button {
            padding: 8px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .filter-group button:hover {
            background: #2563eb;
        }

        .data-table {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        .data-table h2 {
            margin: 0 0 20px 0;
            color: var(--dark);
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--light);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: var(--light);
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 Agent Performance Dashboard</h1>
            <div class="subtitle">Real-time agent performance metrics and analytics</div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <h3>🔍 Filters</h3>
            <div class="filter-group">
                <label>Agent ID:</label>
                <input type="text" id="agentFilter" value="BILLY666" placeholder="Enter Agent ID">

                <label>Period:</label>
                <select id="periodFilter">
                    <option value="7">Last 7 Days</option>
                    <option value="30" selected>Last 30 Days</option>
                    <option value="90">Last 90 Days</option>
                    <option value="all">All Time</option>
                </select>

                <button onclick="loadData()">🔄 Refresh</button>
                <button onclick="exportData()">📥 Export</button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card neutral">
                <div class="label">Total Risk</div>
                <div class="value" id="totalRisk">$0</div>
                <div class="change" id="riskChange">—</div>
            </div>
            <div class="stat-card positive">
                <div class="label">Total Win</div>
                <div class="value" id="totalWin">$0</div>
                <div class="change" id="winChange">—</div>
            </div>
            <div class="stat-card negative">
                <div class="label">Net Income</div>
                <div class="value" id="netIncome">$0</div>
                <div class="change" id="netChange">—</div>
            </div>
            <div class="stat-card neutral">
                <div class="label">Total Wagers</div>
                <div class="value" id="totalWagers">0</div>
                <div class="change" id="wagersChange">—</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid-2">
            <div class="chart-container">
                <h2>💰 Financial Performance Over Time</h2>
                <div class="chart-wrapper">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <h2>🏈 Performance by Sport</h2>
                <div class="chart-wrapper">
                    <canvas id="sportChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Recent Performance Table -->
        <div class="data-table">
            <h2>📋 Recent Performance Reports</h2>
            <div id="tableContent">
                <div class="loading">Loading performance data...</div>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://betting-brain-v3.nolarose1968-806.workers.dev';
        let performanceChart = null;
        let sportChart = null;
        let performanceData = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            setInterval(loadData, 60000); // Refresh every minute
        });

        // Load performance data
        async function loadData() {
            try {
                const agentID = document.getElementById('agentFilter').value || 'BILLY666';
                const period = document.getElementById('periodFilter').value;

                // Fetch from custom API endpoint (you'll need to create this)
                const response = await fetch(`${WORKER_URL}/api/fantasy402/performance?agentID=${agentID}&period=${period}`);

                if (!response.ok) {
                    throw new Error('Failed to fetch performance data');
                }

                const data = await response.json();
                performanceData = data.performance || [];

                // Update stats
                updateStats(performanceData);

                // Update charts
                updateCharts(performanceData);

                // Update table
                updateTable(performanceData);

            } catch (error) {
                console.error('Error loading data:', error);
                showError('Failed to load performance data. Make sure the worker endpoint is configured.');
            }
        }

        // Update statistics cards
        function updateStats(data) {
            if (!data || data.length === 0) {
                document.getElementById('totalRisk').textContent = '$0';
                document.getElementById('totalWin').textContent = '$0';
                document.getElementById('netIncome').textContent = '$0';
                document.getElementById('totalWagers').textContent = '0';
                return;
            }

            const totals = data.reduce((acc, item) => ({
                risk: acc.risk + (item.total_risk || 0),
                win: acc.win + (item.total_win || 0),
                net: acc.net + (item.net_income || 0),
                wagers: acc.wagers + (item.total_wagers || 0)
            }), { risk: 0, win: 0, net: 0, wagers: 0 });

            document.getElementById('totalRisk').textContent = formatCurrency(totals.risk);
            document.getElementById('totalWin').textContent = formatCurrency(totals.win);
            document.getElementById('netIncome').textContent = formatCurrency(totals.net);
            document.getElementById('totalWagers').textContent = totals.wagers.toLocaleString();

            // Calculate win percentage
            const winPct = totals.risk > 0 ? ((totals.win / totals.risk) * 100).toFixed(2) : 0;
            document.getElementById('riskChange').textContent = `${data.length} reports`;
            document.getElementById('winChange').textContent = `Win: ${winPct}%`;
            document.getElementById('netChange').textContent = totals.net >= 0 ? '📈 Profitable' : '📉 Loss';
            document.getElementById('wagersChange').textContent = `Avg: ${(totals.wagers / data.length).toFixed(0)} per report`;
        }

        // Update charts
        function updateCharts(data) {
            if (!data || data.length === 0) return;

            // Performance over time chart
            const ctx1 = document.getElementById('performanceChart');
            if (performanceChart) performanceChart.destroy();

            const sortedData = [...data].sort((a, b) =>
                new Date(a.captured_at) - new Date(b.captured_at)
            );

            performanceChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: sortedData.map(d => new Date(d.captured_at).toLocaleDateString()),
                    datasets: [
                        {
                            label: 'Risk',
                            data: sortedData.map(d => d.total_risk),
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.3
                        },
                        {
                            label: 'Win',
                            data: sortedData.map(d => d.total_win),
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.3
                        },
                        {
                            label: 'Net Income',
                            data: sortedData.map(d => d.net_income),
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: value => '$' + value.toLocaleString()
                            }
                        }
                    }
                }
            });

            // Sport breakdown chart (using latest report's sport data)
            updateSportChart(data[0]); // Use most recent
        }

        // Update sport breakdown chart
        async function updateSportChart(latestReport) {
            try {
                const agentID = document.getElementById('agentFilter').value || 'BILLY666';

                // Fetch sport breakdown data
                const response = await fetch(`${WORKER_URL}/api/fantasy402/sport-performance?agentID=${agentID}`);
                const sportData = await response.json();

                const ctx2 = document.getElementById('sportChart');
                if (sportChart) sportChart.destroy();

                const sports = sportData.sports || [];

                sportChart = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: sports.map(s => s.sport),
                        datasets: [
                            {
                                label: 'Risk',
                                data: sports.map(s => s.total_risk),
                                backgroundColor: 'rgba(59, 130, 246, 0.8)'
                            },
                            {
                                label: 'Win',
                                data: sports.map(s => s.total_win),
                                backgroundColor: 'rgba(16, 185, 129, 0.8)'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top' }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: value => '$' + value.toLocaleString()
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error loading sport data:', error);
            }
        }

        // Update table
        function updateTable(data) {
            const container = document.getElementById('tableContent');

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="loading">No performance data available</div>';
                return;
            }

            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>Period</th>
                            <th>Risk</th>
                            <th>Win</th>
                            <th>Net Income</th>
                            <th>Wagers</th>
                            <th>Win %</th>
                            <th>Captured</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(row => `
                            <tr>
                                <td>${row.period_start} → ${row.period_end}</td>
                                <td>${formatCurrency(row.total_risk)}</td>
                                <td style="color: #10b981">${formatCurrency(row.total_win)}</td>
                                <td style="color: ${row.net_income >= 0 ? '#10b981' : '#ef4444'}">
                                    ${formatCurrency(row.net_income)}
                                </td>
                                <td>${row.total_wagers.toLocaleString()}</td>
                                <td>${((row.total_win / row.total_risk) * 100).toFixed(2)}%</td>
                                <td>${new Date(row.captured_at).toLocaleString()}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // Export data
        function exportData() {
            if (!performanceData || performanceData.length === 0) {
                alert('No data to export');
                return;
            }

            const csv = convertToCSV(performanceData);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `agent-performance-${Date.now()}.csv`;
            a.click();
        }

        // Helper functions
        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(value);
        }

        function showError(message) {
            const container = document.getElementById('tableContent');
            container.innerHTML = `<div class="error-message">${message}</div>`;
        }

        function convertToCSV(data) {
            const headers = Object.keys(data[0]);
            const rows = data.map(row => headers.map(h => row[h]).join(','));
            return [headers.join(','), ...rows].join('\n');
        }
    </script>
</body>

</html>
