# Bun configuration for betting-brain-v3
# https://bun.sh/docs/runtime/bunfig

[install]
# Force use of public npm registry
registry = "https://registry.npmjs.org/"

# Install configuration optimizations
optional = true          # Install optionalDependencies
dev = true              # Install devDependencies
peer = true             # Install peerDependencies (Bun default)
production = false      # Not in production mode
frozenLockfile = false  # Allow lockfile updates
dryRun = false         # Actually install packages

# Performance optimizations
# concurrentScripts = 16  # Concurrent lifecycle scripts (default: CPU cores * 2)

# Installation strategy: "hoisted" (default) or "isolated" (like pnpm)
linker = "hoisted"     # Use hoisted node_modules structure

[test]
# Default timeout for all tests (10 seconds)
timeout = 10000

# Coverage configuration - Enhanced for visualization
coverage = false  # coverage off by default
coverageThreshold = 0.8   # 80% for production code

# Coverage reporters for CI/CD and development (Bun supports: text, lcov)
coverageReporter = ["text", "lcov"]
coverageDirectory = "coverage-reports"

# Exclusions for coverage reporting
coverageExcludeFromTestFiles = false
coverageExclude = [
  "tests/**",
  "scripts/**",
  "tools/**",
  "*.test.ts",
  "*.spec.ts",
  "docs/**"
]

# Test exclusions (don't run archived tests)
testExclude = [
  "docs/**",
  "**/archive/**",
  "**/__archive__/**"
]

# Benchmark configuration
bench = true
benchWarmup = true
benchMinSamples = 10

# Preload files before running tests
# preload = ["./tests/setup/global-setup.ts"]

# Root directory for tests
root = "."

# Snapshot configuration
snapshot = true
snapshotUpdate = false

# Randomization for catching order dependencies
randomize = false
rerunEach = 1
