# Bun configuration for betting-brain-v3
# https://bun.sh/docs/runtime/bunfig

# ========== REGISTRY & AUTHENTICATION ==========
[install.registry]
url = "https://registry.npmjs.org/"   # Public npm registry (default)
# For private registries, uncomment and configure:
# url      = "https://npm.acme.corp"
# username = "ci"
# password = "$NPM_TOKEN"              # Environment variable
# token    = "Bearer $GITHUB_TOKEN"    # Alternative: Bearer token

# ========== SHARED REMOTE CACHE (S3-compatible) ==========
# [install.cache]
# dir             = ".bun-cache"       # Local fallback cache directory
# url             = "https://minio.acme.corp/bun-cache"
# accessKeyID     = "$AWS_ACCESS_KEY_ID"
# secretAccessKey = "$AWS_SECRET_ACCESS_KEY"

# ========== INSTALL CONFIGURATION ==========
[install]
# Dependency types
optional = true          # Install optionalDependencies
dev = true              # Install devDependencies
peer = true             # Install peerDependencies (Bun default)
production = false      # Not in production mode

# Lockfile & behavior
frozenLockfile = false  # Allow lockfile updates (set true in CI)
dryRun = false         # Actually install packages
saveTextLockfile = false # Use binary bun.lock (faster)

# Monorepo & binaries
linker = "hoisted"     # Hoist to root node_modules (or "isolated" for pnpm-style)
binLinks = true        # Expose bins in root node_modules/.bin

# Patches (like patch-package)
patchDir = "patches"   # Directory for *.patch files

# Security - disable lifecycle scripts
trustLevel = "low"     # Never run preinstall/postinstall scripts
# allowedScripts = ["esbuild", "@prisma/engines"]  # Opt-in whitelist

# Performance
# concurrentScripts = 16  # Concurrent lifecycle scripts (default: CPU cores * 2)

[test]
# Default timeout for all tests (10 seconds)
timeout = 10000

# Coverage configuration - Enhanced for visualization
coverage = false  # coverage off by default
coverageThreshold = 0.8   # 80% for production code

# Coverage reporters for CI/CD and development (Bun supports: text, lcov)
coverageReporter = ["text", "lcov"]
coverageDirectory = "coverage-reports"

# Exclusions for coverage reporting
coverageExcludeFromTestFiles = false
coverageExclude = [
  "tests/**",
  "scripts/**",
  "tools/**",
  "*.test.ts",
  "*.spec.ts",
  "docs/**"
]

# Test exclusions (don't run archived tests)
testExclude = [
  "docs/**",
  "**/archive/**",
  "**/__archive__/**"
]

# Benchmark configuration
bench = true
benchWarmup = true
benchMinSamples = 10

# Preload files before running tests
# preload = ["./tests/setup/global-setup.ts"]

# Root directory for tests
root = "."

# Snapshot configuration
snapshot = true
snapshotUpdate = false

# Randomization for catching order dependencies
randomize = false
rerunEach = 1
