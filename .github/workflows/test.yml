name: "Bun Testing Features Integration"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "🧪 Bun Test Suite (Advanced Features)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🥖 Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: "📦 Cache Bun"
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      - name: "📦 Install dependencies"
        run: bun install --frozen-lockfile

      - name: "🧪 Run unit tests (Bun native)"
        run: bun test tests/unit --timeout 5000 --concurrent

      - name: "🧪 Run integration tests"
        run: bun test tests/integration --timeout 10000

      - name: "📊 Generate coverage reports"
        run: bun run test:coverage:full

      - name: "📋 Generate JUnit test report"
        run: bun run test:junit

      - name: "📤 Upload coverage reports"
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.run_id }}
          path: coverage-reports/
          retention-days: 7

      - name: "📊 Upload coverage to Codecov"
        uses: codecov/codecov-action@v4
        with:
          file: coverage-reports/lcov.info
          flags: bun-testing
          name: bun-coverage
          fail_ci_if_error: false

      - name: "🔬 Verify coverage thresholds"
        run: |
          echo "Checking coverage thresholds..."
          bun test --coverage --coverage-report=json
          # Note: Threshold enforcement via bunfig.toml coverageThreshold
