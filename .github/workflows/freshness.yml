name: 'Dependency Freshness'

on:
  schedule:
    # Every Monday at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  freshness:
    name: 'Weekly Dependency Updates'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: 'Install current dependencies'
        run: bun install

      - name: 'Update dependencies'
        run: |
          echo "📦 Updating dependencies..."
          bun update
          echo "✅ Dependencies updated"

      - name: 'Run tests with updated dependencies'
        run: |
          echo "🧪 Running tests with updated dependencies..."
          bun test --randomize
          echo "✅ All tests passed with updated dependencies"

      - name: 'Check for changes'
        id: changes
        run: |
          if git diff --quiet bun.lockb; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No dependency changes"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Dependencies updated"
          fi

      - name: 'Create Pull Request'
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): weekly freshness update'
          title: 'chore(deps): weekly freshness update'
          body: |
            ## 📦 Weekly Dependency Freshness Update

            This PR automatically updates dependencies to their latest versions.

            **Automated checks:**
            - ✅ All dependencies updated via `bun update`
            - ✅ All tests pass with updated dependencies
            - ✅ Build succeeds with updated dependencies

            **Review checklist:**
            - [ ] Review dependency changes in `bun.lockb`
            - [ ] Check for breaking changes in major version updates
            - [ ] Verify CI passes
            - [ ] Merge if all checks pass

            **Generated by:** Dependency Freshness Workflow
            **Frequency:** Weekly (Monday 8 AM UTC)
            **Auto-merge:** No (requires manual review)
          branch: deps/freshness
          delete-branch: true
          labels: |
            dependencies
            automated
            weekly-freshness

      - name: 'Summary'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DEPENDENCY FRESHNESS CHECK COMPLETE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
            echo "📦 Dependencies updated - PR created"
            echo "🔗 Review the PR and merge if all checks pass"
          else
            echo "ℹ️  No dependency changes - everything is up to date"
          fi
          echo ""
